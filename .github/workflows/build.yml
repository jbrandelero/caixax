name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: caixax-apk
          path: app/build/outputs/apk/release/*.apk
      # Release "latest" com o APK: link fixo para baixar no celular
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CaixaX.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CaixaX.apk --title "CaixaX (build ${{ github.run_number }})" --notes "Commit ${{ github.sha }}" --latest
